<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/jyanipur.png" id="dynamic-favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Jyanipur</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Script to dynamically scale the logo, tint it Teak, and add a White background -->
    <script>
      window.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        
        img.src = '/jyanipur.png';
        img.onload = function() {
          // 1. Zoom in heavily (negative coordinates and larger width/height) 
          // to crop out the invisible transparent padding inside your PNG file
          ctx.drawImage(img, -20, -20, 168, 168); 
          
          // 2. Tint the logo Teak
          ctx.globalCompositeOperation = 'source-in';
          ctx.fillStyle = '#B45309';
          ctx.fillRect(0, 0, 128, 128);
          
          // 3. Draw the solid White square background behind it
          ctx.globalCompositeOperation = 'destination-over';
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, 128, 128);
          
          // 4. Inject the new favicon into the browser tab
          const link = document.getElementById('dynamic-favicon');
          link.href = canvas.toDataURL('image/png');
        };
      };
    </script>
  </body>
</html>
